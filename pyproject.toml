[project]
name = "mlnyc-records"
version = "0.1.0"
description = "Scripts for building MyLibraryNYC MARC records."
readme = "README.md"
authors = [
    { name = "Charlotte Kostelic", email = "charlottekostelic@bookops.org" }
]
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "bookops-worldcat>=1.2.0",
    "pydantic>=2.13.4",
    "pymarc>=5.4.0",
    "click>=8.5.0",
    "pydeps>=3.0.8",
    "bookops-nypl-platform",
]

[tool.uv.sources]
bookops-nypl-platform = { git = "https://github.com/BookOps-CAT/bookops-nypl-platform" }

[project.scripts]
mlnyc = "mlnyc_records:main"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov (>=7.1.0)",
    "pytest-mock>=3.15.1",
]

[tool.mypy]
mypy_path = "src"
plugins = ['pydantic.mypy']

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
	"livetest: mark a test hitting live web services",
]
addopts = '-m "not livetest" --cov=mlnyc_records'

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]
omit = ["tests/*"]

[tool.ruff.lint]
select = ["F", "E", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ANN"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pydeps]
cluster = true
exclude_exact = [
    "mlnyc_records.lib"
]
